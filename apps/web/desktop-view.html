<!doctype html>
<html>
  <meta charset="utf-8" /><title>Linux 桌面</title>
  <style>
    html,
    body,
    #screen {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #252c29;
    }
    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #dae3d6;
      font: 14px sans-serif;
    }
    #screen:focus {
      outline: none;
    }
  </style>
  <div id="status">正在连接 Linux 桌面…</div>
  <div id="screen" tabindex="0"></div>
  <script type="module">
    import RFB from "./core/rfb.js";
    const screen = document.getElementById("screen"),
      status = document.getElementById("status");
    const url =
      (location.protocol === "https:" ? "wss://" : "ws://") +
      location.host +
      location.pathname.replace(/\/view$/, "/websockify");
    const rfb = new RFB(screen, url, { shared: true });
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.viewOnly = false;
    rfb.addEventListener("connect", () => {
      status.hidden = true;
      parent.postMessage(
        { type: "finance-desktop-connected" },
        location.origin,
      );
    });
    rfb.addEventListener("disconnect", () => {
      status.hidden = false;
      status.textContent = "桌面连接已断开，请重新连接。";
      parent.postMessage(
        { type: "finance-desktop-disconnected" },
        location.origin,
      );
    });
    rfb.addEventListener("securityfailure", () => {
      status.hidden = false;
      status.textContent = "桌面认证失败，请重新连接。";
      parent.postMessage(
        { type: "finance-desktop-disconnected" },
        location.origin,
      );
    });
  </script>
</html>
