[project]
name = "finance-agent"
version = "0.1.0"
description = "Local-first assistant with persistent tasks and finance tools"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "websockets>=15,<16",
    "python-dotenv>=1,<2",
    "cryptography>=45,<48",
    "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/backend/src/finance_agent"]

[tool.pytest.ini_options]
testpaths = ["services/backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["finance_agent"]

[project.scripts]
finance-admin = "finance_agent.entrypoints.admin:main"
finance-worker = "finance_agent.entrypoints.worker:main"
finance-scheduler = "finance_agent.entrypoints.scheduler:main"
