name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.29'
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/agent-runtime/package-lock.json
      - run: uv sync --locked
      - run: npm ci --prefix services/agent-runtime --ignore-scripts
      - run: npm ci --prefix apps/web --ignore-scripts
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: npm run check --prefix services/agent-runtime
      - run: npm test --prefix services/agent-runtime
      - run: npm test --prefix apps/web
      - run: uv run python scripts/check-secrets.py
